<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./asset/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <section class="login">
      <div class="container">
        <div class="login-card">
          <div class="login-heading">
            <div class="login-logo">
              <img src="./asset/img/logo.png" alt="" />
            </div>            
            <h2 class="login-title">Chào Mừng Trở Lại</h2>
            <p class="desc login-desc">
              Vui Lòng Đăng Nhập Thông Tin của Bạn
            </p>
          </div>
          <form action="" class="form-login">
            <div class="from-group">
              <label for="" class="form-label">Địa chỉ email</label>
              <div class="input-group">
                <input type="email" placeholder="Nhập email của bạn" />
              </div>
            </div>
            <div class="from-group">
              <label for="" class="form-label"> Mật khẩu</label>
              <div class="input-group">
                <input type="password" placeholder="Nhập mật khẩu của bạn" />
              </div>
            </div>
            <div class="login-option">
              <label for="" class="remember">
                <input type="checkbox" />
                <span>Nhớ Tôi</span>
              </label>
              <div class="forgot-password">Quên mật khẩu?</div>
            </div>
            <!-- <a href="./admin.html"
              ><button class="btn-primary btn-login">Đăng Nhập</button></a
            > -->
            <a href="./index.html" class="btn-primary btn-login">Đăng Nhập</a>
          </form>
        </div>
      </div>
    </section>
  </body>
</html>
