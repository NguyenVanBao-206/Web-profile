<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./asset/css/style.css">
</head>

<body>
    <section class="register">
        <div class="container">
            <div class="cart">
                <div class="register-heading">
                    <div class="register-logo">
                        <img src="./asset/img/logo.png" alt="logo">
                    </div>
                    <h2 class="register-title">Chào Mừng Bạn Đến Với Chúng Tôi</h2>
                    <P class="register-desc">Vui Lòng Nhập Thông Tin Đăng Ký</P>
                </div>
                <form action="" class="form-register">
                    <div class="form-group">
                        <label for="" class="form-lable">Địa chỉ email</label>
                        <div class="input-group">
                            <input type="email" placeholder="Nhập email">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="" class="form-lable">Mật khẩu</label>
                        <div class="input-group">
                            <input type="password" placeholder="Nhập mật khẩu">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="" class="form-lable">Số điện thoại</label>
                        <div class="input-group">
                            <input type="text" placeholder="Nhập số điện thoại">
                        </div>
                            <a href="./index.html" class="btn-primary btn-register">Đăng Ký</a>
                            <div class="login-redirect">Bạn đã có tài khoản? <a href="./login.html">Đăng nhập ngay</a></div>
                        </div>
                    </div>
                </form>
    </section>
</body>

</html>
